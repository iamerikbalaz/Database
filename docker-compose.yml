name: ${COMPOSE_PROJECT_NAME:-reawote}

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reawote}
      POSTGRES_USER: ${POSTGRES_USER:-reawote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-reawote}
      POSTGRES_USER: ${POSTGRES_USER:-reawote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOW_INSECURE_COOKIE: ${AUTH_ALLOW_INSECURE_COOKIE:-false}
      AUTH_IDLE_TIMEOUT_MINUTES: ${AUTH_IDLE_TIMEOUT_MINUTES:-30}
      AUTH_ABSOLUTE_TIMEOUT_HOURS: ${AUTH_ABSOLUTE_TIMEOUT_HOURS:-8}
      AUTH_LAST_SEEN_UPDATE_SECONDS: ${AUTH_LAST_SEEN_UPDATE_SECONDS:-60}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      AUTH_ARGON2_MEMORY_KIB: ${AUTH_ARGON2_MEMORY_KIB:-19456}
      AUTH_ARGON2_TIME_COST: ${AUTH_ARGON2_TIME_COST:-2}
      AUTH_ARGON2_PARALLELISM: ${AUTH_ARGON2_PARALLELISM:-1}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-http://worker:8080}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      APP_ENV: development
      MATERIALS_ROOT: ${MATERIALS_ROOT:-/materials}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-30}
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
