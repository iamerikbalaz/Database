[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "reawote-backend"
version = "0.1.0"
description = "REAWOTE internal API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "defusedxml==0.7.1",
  "fastapi>=0.116,<1",
  "google-auth[requests]>=2.40,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "openpyxl==3.1.5",
  "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["texture_categories_2026.json"]
"app.auth" = ["common_passwords.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
