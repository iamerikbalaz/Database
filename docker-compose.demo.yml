name: reawote-demo

services:
  database:
    volumes:
      - type: volume
        source: demo_postgres_data
        target: /var/lib/postgresql

  backend:
    environment:
      APP_ENV: demo
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:15173,http://127.0.0.1:15173}
      WORKER_BASE_URL: http://worker:8080

  worker:
    environment:
      APP_ENV: demo
      MATERIALS_ROOT: /demo-materials
    volumes:
      - type: bind
        source: ./.demo-data/materials
        target: /demo-materials
        read_only: true
    ports:
      - "127.0.0.1:${WORKER_PORT:-18080}:8080"

  frontend:
    environment:
      VITE_API_BASE_URL: /api
      BACKEND_PROXY_TARGET: http://backend:8000

volumes:
  demo_postgres_data:
    name: reawote-demo-postgres-data
